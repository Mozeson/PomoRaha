<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zettel — Online Zettelkasten</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗃️</text></svg>">
</head>
<body>
<div id="app">

  <!-- ============ LEFT SIDEBAR ============ -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="vault-title">
        <span class="vault-icon">🗃️</span>
        <span>Zettel</span>
      </div>
      <div class="sidebar-actions">
        <button id="btn-new-note" class="icon-btn" title="New note (Ctrl+N)">＋</button>
        <button id="btn-graph" class="icon-btn" title="Graph view (Ctrl+G)">◉</button>
        <button id="btn-vault-menu" class="icon-btn" title="Vault options">⋯</button>
      </div>
    </div>

    <div id="vault-menu" class="dropdown hidden">
      <button data-action="export-vault">Export vault (.json)</button>
      <button data-action="import-vault">Import vault (.json)</button>
      <button data-action="export-note">Export current note (.md)</button>
      <hr>
      <button data-action="reset-vault" class="danger">Reset vault…</button>
    </div>

    <div class="search-box">
      <input id="search-input" type="text" placeholder="Search notes…" autocomplete="off">
    </div>

    <div id="type-filters" class="type-filters">
      <button class="chip active" data-type="all">All</button>
      <button class="chip chip-fleeting" data-type="fleeting" title="Quick capture of a passing idea">Fleeting</button>
      <button class="chip chip-literature" data-type="literature" title="Notes on something you read/watched">Literature</button>
      <button class="chip chip-permanent" data-type="permanent" title="One atomic idea in your own words">Permanent</button>
      <button class="chip chip-index" data-type="index" title="Entry point / map of content">Index</button>
    </div>

    <div id="note-list" class="note-list"></div>

    <div id="tag-pane" class="tag-pane">
      <div class="pane-title">Tags</div>
      <div id="tag-list" class="tag-list"></div>
    </div>
  </aside>

  <!-- ============ MAIN AREA ============ -->
  <main id="main">
    <button id="btn-toggle-sidebar" class="icon-btn edge-toggle" title="Toggle sidebar">☰</button>

    <!-- Note view -->
    <section id="note-view">
      <header class="note-header">
        <div class="note-header-top">
          <input id="note-title" type="text" placeholder="Untitled" autocomplete="off" spellcheck="false">
          <div class="note-header-actions">
            <select id="note-type" title="Zettelkasten note type">
              <option value="fleeting">🌱 Fleeting</option>
              <option value="literature">📖 Literature</option>
              <option value="permanent">🧠 Permanent</option>
              <option value="index">🗺️ Index</option>
            </select>
            <button id="btn-mode" class="icon-btn" title="Toggle edit/preview (Ctrl+E)">👁</button>
            <button id="btn-delete" class="icon-btn" title="Delete note">🗑</button>
          </div>
        </div>
        <div class="note-meta">
          <span id="note-id" title="Zettel ID"></span>
          <span id="note-dates"></span>
        </div>
      </header>

      <div id="editor-wrap">
        <textarea id="editor" dir="auto" placeholder="Write one idea. Link it with [[double brackets]]. Tag it with #tags." spellcheck="false"></textarea>
        <div id="preview" class="markdown-body"></div>
        <div id="autocomplete" class="dropdown hidden"></div>
      </div>
    </section>

    <!-- Graph view -->
    <section id="graph-view" class="hidden">
      <canvas id="graph-canvas"></canvas>
      <div class="graph-legend">
        <span><i class="dot dot-fleeting"></i>Fleeting</span>
        <span><i class="dot dot-literature"></i>Literature</span>
        <span><i class="dot dot-permanent"></i>Permanent</span>
        <span><i class="dot dot-index"></i>Index</span>
      </div>
      <button id="btn-close-graph" class="icon-btn graph-close" title="Back to notes (Esc)">✕</button>
    </section>

    <!-- Empty state -->
    <section id="empty-view" class="hidden">
      <div class="empty-box">
        <div class="empty-icon">🗃️</div>
        <p>No note selected.</p>
        <button id="btn-empty-new" class="primary-btn">Create a note</button>
      </div>
    </section>

    <footer id="status-bar">
      <span id="status-counts"></span>
      <span id="status-hint">Ctrl+N new · Ctrl+O quick switch · Ctrl+E edit/preview · Ctrl+G graph</span>
    </footer>
  </main>

  <!-- ============ RIGHT PANEL ============ -->
  <aside id="right-panel">
    <div class="pane">
      <div class="pane-title">Backlinks <span id="backlink-count" class="count"></span></div>
      <div id="backlinks" class="link-pane"></div>
    </div>
    <div class="pane">
      <div class="pane-title">Outgoing links <span id="outlink-count" class="count"></span></div>
      <div id="outlinks" class="link-pane"></div>
    </div>
  </aside>
</div>

<!-- Quick switcher -->
<div id="switcher-overlay" class="overlay hidden">
  <div class="switcher">
    <input id="switcher-input" type="text" placeholder="Jump to or create a note…" autocomplete="off">
    <div id="switcher-results"></div>
  </div>
</div>

<input type="file" id="import-file" accept=".json" class="hidden">

<script src="/js/store.js"></script>
<script src="/js/markdown.js"></script>
<script src="/js/graph.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
