<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16161e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Capture 🌱 — Zettel</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root {
  --bg-0: #16161e;
  --bg-1: #1b1b24;
  --bg-2: #21212c;
  --border: #2e2e3e;
  --text: #d5d6e0;
  --text-dim: #8b8ca0;
  --text-faint: #62637a;
  --green: #6cbf6c;
  --blue: #7aa2f7;
  --red: #e06c75;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg-0);
  color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Hebrew', sans-serif;
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 10px;
}
header h1 { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
header a { color: var(--text-dim); text-decoration: none; font-size: 13px; }
header a:active { color: var(--text); }

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 0 16px;
  gap: 10px;
  min-height: 0;
}
#idea {
  flex: 1;
  width: 100%;
  min-height: 140px;
  background: var(--bg-1);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  font: inherit;
  font-size: 17px;
  resize: none;
  outline: none;
  direction: ltr;
  unicode-bidi: plaintext;
}
#idea:focus { border-color: var(--green); }
#idea::placeholder { color: var(--text-faint); }

#tags {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  flex: none;
}
#tags::-webkit-scrollbar { display: none; }
#tags button {
  flex: none;
  font: inherit;
  font-size: 13px;
  color: var(--blue);
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  cursor: pointer;
}
#tags button:active { background: var(--border); }

#save {
  flex: none;
  font: inherit;
  font-size: 17px;
  font-weight: 700;
  color: #0d130d;
  background: var(--green);
  border: none;
  border-radius: 14px;
  padding: 15px;
  cursor: pointer;
  margin-bottom: 8px;
}
#save:active { filter: brightness(1.12); }
#save:disabled { opacity: .5; }

footer {
  flex: none;
  text-align: center;
  font-size: 12px;
  color: var(--text-faint);
  padding: 2px 16px 12px;
  min-height: 32px;
}
#queue-badge { color: var(--red); }

#toast {
  position: fixed;
  left: 50%;
  bottom: 90px;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 18px;
  border-radius: 24px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s, transform .18s;
  white-space: nowrap;
  box-shadow: 0 8px 28px rgba(0,0,0,.5);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <h1>🌱 Quick capture</h1>
  <a href="/">Open vault →</a>
</header>
<main>
  <textarea id="idea" dir="auto" placeholder="What's the idea? One thought — you'll process it later." autofocus></textarea>
  <div id="tags"></div>
  <button id="save">Capture</button>
</main>
<footer>
  <span id="status">Files into your vault as a 🌱 fleeting note.</span>
  <span id="queue-badge"></span>
</footer>
<div id="toast"></div>
<script src="/js/capture.js"></script>
</body>
</html>
